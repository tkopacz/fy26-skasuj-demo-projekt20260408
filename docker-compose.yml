version: "3.9"

services:
  # Generate test certificates before the relay service starts
  cert-init:
    image: alpine/openssl:latest
    volumes:
      - ./certs:/certs
      - ./scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/generate_certs.sh", "/certs"]
    # This container exits after generating certs
    restart: "no"

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      cert-init:
        condition: service_completed_successfully
    ports:
      # mTLS transport
      - "8443:8443"
      # Health endpoint (bind to localhost only on the host)
      - "127.0.0.1:8080:8080"
    volumes:
      # TLS certificates (generated by cert-init or provided externally)
      - ./certs:/app/certs:ro
      # Configuration files
      - ./config.yaml:/app/config.yaml:ro
      - ./config:/app/config:ro
      # Persistent data (auth DB, queue DB)
      - relay-data:/app/data
      # Audit logs
      - relay-logs:/app/logs
    environment:
      # REQUIRED: provide a strong random secret for audit log HMAC integrity
      - RELAY_AUDIT_HMAC_SECRET=${RELAY_AUDIT_HMAC_SECRET:?RELAY_AUDIT_HMAC_SECRET must be set}
      - RELAY_LOG_LEVEL=${RELAY_LOG_LEVEL:-INFO}
    restart: unless-stopped
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  relay-data:
    driver: local
  relay-logs:
    driver: local
