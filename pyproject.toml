[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tactical-relay"
version = "0.1.0"
description = "Secure tactical message relay service"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0",
    "PyYAML>=6.0",
    "protobuf>=4.25",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tactical_relay*"]
